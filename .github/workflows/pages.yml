name: GitHub Pages

on:
  push:
    branches: [codex/pages-preview]
  workflow_dispatch:
    inputs:
      source_version:
        description: EC2 public content digest
        type: string
        required: false
      force:
        description: Rebuild even when content has not changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/pages-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      pages: read
    outputs:
      changed: ${{ steps.snapshot.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run test:pages
      - name: Collect and verify public snapshot
        id: snapshot
        run: npm run build:pages
        env:
          PAGES_SOURCE_URL: ${{ vars.PAGES_SOURCE_URL || 'https://crusthack.com' }}
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_SOURCE_VERSION: ${{ inputs.source_version }}
          PAGES_FORCE: ${{ inputs.force || false }}
      - name: Upload changed snapshot
        if: steps.snapshot.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: out/pages

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy changed snapshot
        id: deployment
        uses: actions/deploy-pages@v4
