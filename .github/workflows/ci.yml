name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Blog.slnx
      - run: dotnet format Blog.slnx --verify-no-changes --no-restore
      - run: dotnet test Blog.slnx --configuration Release --no-restore
      - name: Verify production publish
        shell: bash
        run: |
          dotnet publish apps/backend/Blog.Api.csproj \
            --configuration Release \
            --no-restore \
            --output artifacts/backend
          test ! -f artifacts/backend/appsettings.Development.json
          ! grep -R --fixed-strings --files-with-matches localdev artifacts/backend

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint:frontend
      - run: npm run test:frontend
      - run: npm run build:frontend
        env:
          API_SERVER_URL: http://backend:8080

  deployment:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral validation secrets
        shell: bash
        run: |
          chmod +x deploy/scripts/*.sh
          deploy/scripts/create-setup-secret.sh
          openssl req -x509 -newkey rsa:2048 -sha256 -days 2 -nodes \
            -keyout secrets/cloudflare-origin.key \
            -out secrets/cloudflare-origin.pem \
            -subj '/CN=crusthack.com' \
            -addext 'subjectAltName=DNS:crusthack.com'
      - name: Validate scripts and Compose variants
        shell: bash
        run: |
          for script in deploy/scripts/*.sh; do bash -n "$script"; done
          deploy/scripts/production-preflight.sh
          deploy/scripts/production-preflight.sh --bootstrap
          deploy/scripts/production-preflight.sh --cloudflare
          deploy/scripts/production-preflight.sh --cloudflare --bootstrap
      - name: Validate Nginx configurations
        shell: bash
        run: |
          docker run --rm \
            --add-host frontend:127.0.0.1 \
            --add-host backend:127.0.0.1 \
            --volume "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.30.4-alpine nginx -t
          docker run --rm \
            --add-host frontend:127.0.0.1 \
            --add-host backend:127.0.0.1 \
            --volume "$PWD/deploy/nginx/nginx.cloudflare.conf:/etc/nginx/nginx.conf:ro" \
            --volume "$PWD/secrets/cloudflare-origin.pem:/run/secrets/cloudflare_origin_certificate:ro" \
            --volume "$PWD/secrets/cloudflare-origin.key:/run/secrets/cloudflare_origin_private_key:ro" \
            nginx:1.30.4-alpine nginx -t
