name: blog

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      BLOG_ConnectionStrings__BlogDatabase: Data Source=/app/runtime/blog.db
      BLOG_BOOTSTRAP__TOKENFILE: /run/secrets/owner_bootstrap_token
    volumes:
      - blog_runtime:/app/runtime
    secrets:
      - owner_bootstrap_token
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        API_SERVER_URL: http://backend:8080
    restart: unless-stopped
    environment:
      API_SERVER_URL: http://backend:8080
    depends_on:
      - backend
    expose:
      - "3000"

  nginx:
    image: nginx:1.31-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  blog_runtime:

secrets:
  owner_bootstrap_token:
    file: ./secrets/owner-bootstrap-token
